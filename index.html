<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">
  <title>人類最強決定戦</title>
  <style>
    :root {
      /* 画像の差し替え・最適化手順: docs/colosseum-background.md */
      --arena-background-image: url('./assets/backgrounds/colosseum.webp');
      --arena-background-position: 50% 50%;
      --arena-background-overlay: rgb(10 9 15 / 60%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background: radial-gradient(ellipse at top, #29233e, #10121b 70%);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.75rem, 6vw, 3.5rem);
      line-height: 1.5;
      letter-spacing: 0.06em;
      overflow-wrap: anywhere;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #d8d4e4;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    button {
      min-height: 56px;
      width: min(100%, 280px);
      padding: 16px 32px;
      border: 1px solid #ffd18a;
      border-radius: 12px;
      color: #231600;
      background: #ffbf60;
      font: inherit;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #ffd18a; }
    button:active { background: #efa640; }
    button:focus-visible { outline: 3px solid #ffffff; outline-offset: 6px; }

    [hidden] { display: none !important; }
    body.in-game { display: block; }
    main.playing { max-width: 760px; margin: 0 auto; padding: 12px 0; }
    h2 { margin: 0 0 16px; font-size: clamp(1.5rem, 5vw, 2rem); }
    h3 { margin: 20px 0 12px; font-size: 1.1rem; }
    .hand, .cpu-hand {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 12px 0;
      list-style: none;
    }
    .hand {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
    }
    .cpu-hand {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      min-height: 100px;
    }
    .hand > li, .cpu-hand > li { min-width: 0; }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 20px 12px;
      border: 2px solid #625575;
      border-radius: 12px;
      background: #211e30;
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 400;
      text-align: left;
      overflow-wrap: anywhere;
    }
    button.card:hover { background: #30283f; }
    .card[aria-pressed="true"] { border-color: #ffbf60; background: #392d30; }
    .card-name { font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 700; }
    .card-profile { color: #d8d4e4; font-size: 0.85rem; line-height: 1.8; }
    /* 古い描画コードが残った場合も、手札・出場カードの能力値を表示しない。 */
    #hand .card-stats, #cpu-hand .card-stats, #player-fighter .card-stats, #cpu-fighter .card-stats {
      display: none !important;
    }
    .round-result { margin-top: 16px; padding: 12px; border: 1px solid #625575; border-radius: 12px; }
    .result-headline { color: #ffcf89; font-size: 1.1rem; line-height: 1.6; margin: 20px 0 8px; }
    .round-result h3 { margin: 0 0 12px; }
    .round-result table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.85rem; }
    .round-result caption { font-size: 0.8rem; margin-bottom: 8px; color: #d8d4e4; }
    .round-result th, .round-result td { padding: 8px 2px; border-bottom: 1px solid #625575; overflow-wrap: anywhere; }
    .result-finish { margin: 12px 0 0; line-height: 1.7; color: #ffc45e; overflow-wrap: anywhere; }
    .story-note { font-size: 0.8rem; line-height: 1.7; color: #d8d4e4; }
    .result-reason { white-space: pre-line; font-size: 1rem; line-height: 1.9; overflow-wrap: anywhere; text-align: left; margin: 12px 0 0; }
    .turn-status { margin: 0 0 8px; padding: 0; border: 0; color: #ffcf89; font-size: 0.8rem; line-height: 1.5; font-weight: 700; overflow-wrap: anywhere; }
    .match-score { margin: 0 0 4px; font-size: clamp(0.75rem, 3.1vw, 1rem); white-space: nowrap; color: #ffcf89; font-weight: 700; line-height: 1.6; }
    .card.used { opacity: 0.5; border-style: dashed; }
    .used-label { margin-top: auto; color: #d8d4e4; font-size: 0.75rem; }
    .selection-label { margin-top: auto; color: #ffcf89; font-size: 0.8rem; }
    /* 手札だけを3列に調整し、中央の出場カードの文字サイズは維持する。 */
    .hand .card, .cpu-hand .card { padding: 12px 4px; gap: 10px; border-radius: 8px; }
    .hand .card-name, .cpu-hand .card-name {
      font-size: clamp(0.75rem, 3.2vw, 1rem);
      line-height: 1.5;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .hand .card-profile, .cpu-hand .card-profile { font-size: clamp(0.6875rem, 2.7vw, 0.85rem); line-height: 1.65; }
    .hand .selection-label { font-size: clamp(0.625rem, 2.1vw, 0.8rem); line-height: 1.6; }
    .card-back {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 96px;
      padding: 12px 4px;
      border: 2px solid #625575;
      border-radius: 12px;
      color: #d8d4e4;
      background: repeating-linear-gradient(135deg, #211e30, #211e30 10px, #2d2540 10px, #2d2540 12px);
      font-size: 0.75rem;
    }
    .card-back > span:first-child { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; }
    .vs { margin: 24px 0; color: #ffbf60; font-size: 2rem; font-weight: 800; letter-spacing: 0.1em; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 24px; }
    .actions button { width: min(100%, 280px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:disabled:hover { background: #ffbf60; }
    .secondary { background: transparent; color: #ffcf89; }
    .secondary:hover { background: #30283f; }
    .battle-area { margin: 16px 0; scroll-margin-top: 16px; }
    .battle-area h2 { margin-bottom: 12px; }
    #hand-screen > h3 { margin: 16px 0 8px; }
    #hand-screen > .actions { margin-top: 16px; }
    .battle-area .actions { margin-top: 0; }
    .battle-area .actions button:not([hidden]) { margin-top: 12px; }
    .battle-arena { position: relative; isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      gap: 8px;
      align-items: stretch;
    }
    /* 装飾はカード・演出の背面に置く。viewport固定にせず、闘技場と一緒にスクロールする。
       結果・物語は .battle-arena の外なので、表示後も背景の中心は動かない。 */
    .battle-arena::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: 12px;
      background-image:
        linear-gradient(var(--arena-background-overlay), var(--arena-background-overlay)),
        var(--arena-background-image);
      background-position: var(--arena-background-position);
      background-size: cover;
      background-repeat: no-repeat;
    }
    .battle-side { display: flex; flex-direction: column; min-width: 0; width: min(100%, 280px); }
    .battle-side h3 { margin: 0 0 6px; font-size: 0.9rem; letter-spacing: 0.06em; }
    /* 将来の突進演出は、Y軸上でCPUを下、PLAYERを上へ動かし、中央で3回衝突させる。 */
    .battle-side--player { --attack-direction: -1; }
    .battle-side--cpu { --attack-direction: 1; }
    .battle-arena > .vs { align-self: center; margin: 0; font-size: clamp(1rem, 4vw, 2rem); }
    .battle-arena > .vs { position:relative; }
    #hand-screen[data-phase="win"] #vs-text, #hand-screen[data-phase="result"] #vs-text { visibility:hidden; }
    #skip-button { position:fixed; bottom:12px; right:12px; z-index:30; width:auto; max-width:calc(100% - 24px); background:#211e30; font-size:0.9rem; padding:10px 16px; }
    html { scrollbar-gutter: stable; }
    #impact-flash { position:absolute; inset:0; z-index:8; pointer-events:none; opacity:0; border-radius:12px; background:radial-gradient(ellipse,#fff3ce,#ffad4188,transparent); }
    #burn-effects { position:absolute; inset:0; pointer-events:none; z-index:6; }
    .burn-edge { position:absolute; height:12px; background:linear-gradient(0deg,transparent,#f43b12,#ffbc32,#fff1a0,transparent); box-shadow:0 0 12px #ff6a20; }
    .ember { position:absolute; top:0; width:3px; height:5px; background:#ffcb69; box-shadow:0 0 5px #ff4b21; border-radius:50%; }
    .winner-card { border-color:#ffe193; box-shadow:0 0 18px #ffc45e99; }
    #cpu-fighter.winner-card > .card { border-color:#ffe193; }
    #win-banner { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:9; color:#ffe2a2; text-shadow:0 0 10px #d56a1c; font-size:clamp(1rem,4.5vw,1.5rem); line-height:1; font-weight:900; white-space:nowrap; pointer-events:none; }
    .motion-choice, .moving-card { border-color: #ffbf60; box-shadow: 0 0 12px #ffbf6055; }
    .fighter-slot { transform-origin: top left; position: relative; z-index: 2; }
    .hand .card[aria-pressed="true"] { box-shadow: 0 0 0 2px #ffbf6066; }
    .fighter-slot { width: 100%; flex: 1; margin: 0 auto; perspective: 800px; min-width: 0; }
    .battle-arena .fighter-card, .battle-arena .card-back { min-height: 112px; height: auto; }
    .battle-arena .fighter-card { padding: 12px 16px; gap: 8px; }
    .empty-fighter { color: #d8d4e4; line-height: 1.8; }
    .battle-area .status { margin-top: 16px; }
    button.card:disabled { opacity: 0.75; cursor: default; }
    button.card:disabled:hover { background: #211e30; }
    button.card[aria-pressed="true"]:disabled:hover { background: #392d30; }
    .fighter-card { justify-content: center; }
    .revealed > .fighter-card { animation: reveal-card 600ms ease-out; }
    @keyframes reveal-card {
      from { transform: rotateY(90deg); opacity: 0.2; }
      to { transform: rotateY(0deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .revealed > .fighter-card { animation: none; }
    }
    @media (min-width: 600px) {
      .card { padding: 24px; }
      .hand, .cpu-hand { gap: 16px; }
      .hand .card, .cpu-hand .card { padding: 16px 10px; gap: 12px; }
    }
    @media (max-width: 599px) {
      body.in-game { padding: 8px 12px; }
      main.playing { padding: 0; }
      #hand-title, .battle-area h2 { font-size: 1rem; margin-bottom: 4px; }
      .hand, .cpu-hand { margin: 6px 0; }
      .battle-area { margin: 8px 0; }
      .battle-arena { position: relative; isolation: isolate; gap: 4px; }
      .battle-side h3 { font-size: 0.75rem; margin-bottom: 3px; }
      .battle-arena > .vs { font-size: 1rem; line-height: 1.2; }
      .battle-arena .fighter-card { min-height: 80px; padding: 8px 12px; gap: 4px; }
      .battle-arena .card-back { min-height: 64px; padding: 6px 4px; gap: 2px; }
      .battle-arena .card-back > span:first-child { font-size: 1.25rem; }
      #player-fighter:has(.empty-fighter) { min-height: 56px; }
      .empty-fighter { font-size: 0.85rem; }
      #hand-screen > h3 { margin: 8px 0 4px; font-size: 1rem; }
      #hand-screen > .actions { margin-top: 8px; gap: 8px; }
      .battle-area .actions button:not([hidden]) { margin-top: 6px; }
      .battle-area .status { margin-top: 8px; }
      #status { margin-top: 8px; }
    }

    .status {
      margin: 16px 0 0;
      color: #d8d4e4;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status:empty { margin: 0; }
  </style>
</head>
<body>
  <main>
    <section id="title-screen" aria-labelledby="title">
      <h1 id="title">人類最強決定戦</h1>
      <p class="subtitle">30人の戦士から最強を決めろ！</p>
      <button id="start-button" type="button">ゲーム開始</button>
    </section>
    <section id="hand-screen" aria-labelledby="hand-title" hidden>
      <p id="match-score" class="match-score" role="status"></p>
      <p id="turn-status" class="turn-status" role="status"></p>
      <h2 id="hand-title" tabindex="-1">CPUの手札</h2>
      <ul id="cpu-hand" class="cpu-hand" aria-label="CPUの手札3枚"></ul>
      <section id="battle-area" class="battle-area" aria-labelledby="battle-title">
        <h2 id="battle-title" tabindex="-1">バトルエリア</h2>
        <div id="battle-arena" class="battle-arena" data-attack-axis="y">
          <section class="battle-side battle-side--cpu" data-attack-direction="down" aria-labelledby="cpu-label">
            <h3 id="cpu-label">CPU</h3>
            <div id="cpu-fighter" class="fighter-slot">
              <div class="card-back" role="img" aria-label="CPUが選んだ裏向きカード"><span aria-hidden="true">?</span><span>CPU</span></div>
            </div>
          </section>
          <div id="impact-flash" aria-hidden="true"></div>
          <div id="burn-effects" aria-hidden="true"></div>
          <div class="vs" aria-label="対戦"><span id="vs-text">VS</span><span id="win-banner" role="status" hidden></span></div>
          <section class="battle-side battle-side--player" data-attack-direction="up" aria-labelledby="player-label">
            <h3 id="player-label">あなた</h3>
            <div id="player-fighter" class="card fighter-card fighter-slot"><span class="empty-fighter">手札からカードを選んでください</span></div>
          </section>
        </div>
        <div class="actions">
          <button id="return-button" type="button" hidden>次のラウンドへ</button>
        </div>
        <p id="battle-status" class="status" role="status"></p>
        <section id="round-result" class="round-result" aria-labelledby="result-title" hidden>
          <h3 id="result-title">ラウンドの結果</h3>
          <p id="result-probability"></p>
          <table>
            <caption>ふたりの能力を見くらべよう</caption>
            <thead><tr><th scope="col">能力</th><th scope="col">あなた</th><th scope="col">CPU</th></tr></thead>
            <tbody id="result-stats"></tbody>
          </table>
          <h4 id="result-headline" class="result-headline"></h4>
          <p class="story-note">能力と勝敗からふくらませた物語です。</p>
          <p id="result-reason" class="result-reason"></p>
          <p id="result-finish" class="result-finish"></p>
        </section>
      </section>
      <h3>あなたの手札</h3>
      <ul id="hand" class="hand" aria-label="あなたの手札3枚"></ul>
      <div class="actions">
        <button id="skip-button" class="secondary" type="button" hidden>演出をスキップ</button>
        <button id="redeal-button" class="secondary" type="button">新しい試合</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script src="./js/characters.js?v=one-tap-battle-1" defer></script>
  <script src="./js/battle.js?v=one-tap-battle-1" defer></script>
  <script src="./js/combat-styles.js?v=one-tap-battle-1" defer></script>
  <script src="./js/story.js?v=one-tap-battle-1" defer></script>
  <script src="./js/match.js?v=one-tap-battle-1" defer></script>
  <script src="./js/game.js?v=one-tap-battle-1" defer></script>
</body>
</html>
