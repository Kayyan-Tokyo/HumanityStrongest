<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">
  <title>人類最強決定戦</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background: radial-gradient(ellipse at top, #29233e, #10121b 70%);
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 48px 0;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.75rem, 6vw, 3.5rem);
      line-height: 1.5;
      letter-spacing: 0.06em;
      overflow-wrap: anywhere;
    }

    .subtitle {
      margin: 0 0 40px;
      color: #d8d4e4;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    button {
      min-height: 56px;
      width: min(100%, 280px);
      padding: 16px 32px;
      border: 1px solid #ffd18a;
      border-radius: 12px;
      color: #231600;
      background: #ffbf60;
      font: inherit;
      font-size: 1.125rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:hover { background: #ffd18a; }
    button:active { background: #efa640; }
    button:focus-visible { outline: 3px solid #ffffff; outline-offset: 6px; }

    [hidden] { display: none !important; }
    main.playing { max-width: 1120px; }
    h2 { margin: 0 0 16px; font-size: clamp(1.5rem, 5vw, 2rem); }
    .hand-note { color: #d8d4e4; line-height: 1.8; }
    .hand {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0;
      margin: 24px 0;
      list-style: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      height: 100%;
      min-width: 0;
      padding: 16px 12px;
      border: 2px solid #625575;
      background: #211e30;
      color: #f8fafc;
      font-size: 0.9rem;
      font-weight: 400;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .card:hover { background: #30283f; }
    .card[aria-pressed="true"] { border-color: #ffbf60; background: #392d30; }
    .card-name { font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 700; }
    .card-profile { color: #d8d4e4; font-size: 0.85rem; line-height: 1.8; }
    .card-stats { display: grid; gap: 8px; width: 100%; }
    .card-stats > span { display: flex; justify-content: space-between; gap: 8px; }
    .selection-label { margin-top: auto; color: #ffcf89; font-size: 0.8rem; }
    @media (min-width: 900px) {
      .hand { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
      .card { padding: 24px 20px; }
    }

    .status {
      min-height: 3em;
      margin: 24px 0 0;
      color: #d8d4e4;
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <section id="title-screen" aria-labelledby="title">
      <h1 id="title">人類最強決定戦</h1>
      <p class="subtitle">30人の戦士から最強を決めろ！</p>
      <button id="start-button" type="button">ゲーム開始</button>
    </section>
    <section id="hand-screen" aria-labelledby="hand-title" hidden>
      <h2 id="hand-title" tabindex="-1">あなたの手札</h2>
      <p class="hand-note">名前・プロフィール・能力値はすべて仮データです。<br>カードをタップして選択できます。対戦機能は準備中です。</p>
      <ul id="hand" class="hand" aria-label="配られた4人の戦士"></ul>
      <button id="redeal-button" type="button">配り直す</button>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script src="./js/characters.js" defer></script>
  <script src="./js/game.js" defer></script>
</body>
</html>
